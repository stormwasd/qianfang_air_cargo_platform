# ============================================================
# 千方航空物流平台 - Docker Compose 编排文件
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并修改配置
#   2. docker-compose up -d
#   3. 首次启动后初始化数据库：
#      docker-compose exec app python init_db.py
#
# 挂载说明：
#   - ./documents      → 模板文件目录，修改后立即生效
#   - ./generated_files → 制单生成的文件，可通过文件共享服务共享
#   - ./.env            → 项目配置文件，修改后需重启服务
# ============================================================

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0.39
    container_name: qianfang-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-QianFang@2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qianfang_air_cargo}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-QianFang@2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qianfang-network

  # ========== 携程专用免费代理池 ==========
  # 镜像固定到 2026-06-15 的上游版本，避免 latest 漂移导致线上行为突变。
  # 代理池会持续采集并验证代理；后端还会用携程接口做第二层实测和淘汰。
  ctrip-proxy-redis:
    image: redis:7-alpine
    container_name: qianfang-ctrip-proxy-redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qianfang-network

  ctrip-proxy-pool:
    image: jhao104/proxy_pool@sha256:2a1511ef3f34388478acdd79eedd7f64d664e0efd9ce1af3c501a1a534d72aa3
    container_name: qianfang-ctrip-proxy-pool
    restart: always
    # 上游镜像入口依赖镜像内不存在的 bash；直接覆盖为 API 进程。
    entrypoint: ["tini", "--"]
    command: ["python", "proxyPool.py", "server"]
    environment:
      DB_CONN: redis://@ctrip-proxy-redis:6379/0
      # 上游先筛选能访问携程 GUID 接口的 HTTPS 代理。
      HTTPS_URL: "https://m.ctrip.com/restapi/soa2/10290/createclientid?systemcode=09&createtype=3&contentType=json"
      VERIFY_TIMEOUT: "10"
      MAX_FAIL_COUNT: "0"
      POOL_SIZE_MIN: "20"
      TIMEZONE: Asia/Shanghai
    expose:
      - "5010"
    ports:
      - "127.0.0.1:5010:5010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/count/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      ctrip-proxy-redis:
        condition: service_healthy
    networks:
      - qianfang-network

  ctrip-proxy-scheduler:
    image: jhao104/proxy_pool@sha256:2a1511ef3f34388478acdd79eedd7f64d664e0efd9ce1af3c501a1a534d72aa3
    container_name: qianfang-ctrip-proxy-scheduler
    restart: always
    # 采集/校验进程和 API 进程分开运行，任一异常时可独立重启。
    entrypoint: ["tini", "--"]
    command: ["python", "proxyPool.py", "schedule"]
    environment:
      DB_CONN: redis://@ctrip-proxy-redis:6379/0
      HTTPS_URL: "https://m.ctrip.com/restapi/soa2/10290/createclientid?systemcode=09&createtype=3&contentType=json"
      VERIFY_TIMEOUT: "10"
      MAX_FAIL_COUNT: "0"
      POOL_SIZE_MIN: "20"
      TIMEZONE: Asia/Shanghai
    depends_on:
      ctrip-proxy-redis:
        condition: service_healthy
    networks:
      - qianfang-network

  # ========== 千方航空物流平台 API 服务 ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qianfang-app
    restart: always
    env_file:
      - .env
    environment:
      CTRIP_PROXY_ENABLED: ${CTRIP_PROXY_ENABLED:-True}
      CTRIP_PROXY_POOL_URL: ${CTRIP_PROXY_POOL_URL:-http://ctrip-proxy-pool:5010}
      CTRIP_PROXY_MAX_ATTEMPTS: ${CTRIP_PROXY_MAX_ATTEMPTS:-5}
      CTRIP_PROXY_POOL_TIMEOUT_SECONDS: ${CTRIP_PROXY_POOL_TIMEOUT_SECONDS:-3}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # 模板文件挂载：修改模板后立即生效，无需重建镜像
      - ./documents:/app/documents
      # 生成文件挂载：制单后生成的文件会写入此目录，可通过文件共享服务访问
      - ./generated_files:/app/generated_files
      # 配置文件挂载：修改 .env 后需重启服务
      - ./.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qianfang-network

volumes:
  mysql_data:
    driver: local

networks:
  qianfang-network:
    driver: bridge
