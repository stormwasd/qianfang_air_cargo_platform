purpose:
  stands_in_for: CSA booking-change forward, missing-contact save and refreshed context, original animal declaration, changed weight/price/charge, goods check, checkChange and createChange.
  unblocks: Local HTTP verification without real airline transactions or captured credentials.
assumptions:
  - id: changed-order-identity-and-submit-sequence
    status: supported
    claim: In the local scenarios, the real Python client preserves the original order/version/bookId and submits identical checkChange/createChange bodies only after successful prerequisite checks.
    reason: The local mock validates original identities and equality of the last two request bodies; recorded requests confirm the changed client reached these routes over HTTP.
    verification: On 2026-11-10, tests.test_china_southern_air_direct_change exercised success, goods rejection, change rejection and create HTTP 500 through the local Postman simulation. The four scenarios made 29 airline-shaped HTTP requests, including one successful create and one create 500. Rejections stopped at the expected check and no scenario retried create. Additional MockTransport tests cover timeout, non-JSON, pending status, business rejection, required-fee recalculation and preservation of existing declaration/contact data.
    source: tests/test_china_southern_air_direct_change.py; postman/mocks/csa-change/default.js; app/services/china_southern_air_direct_change.py
    updated_at: "2026-11-10"
  - id: direct-booking-invoice-persistence-and-mutual-exclusion
    status: supported
    claim: In the SQLite API scenarios, direct invoicing commits a claim before network work, preserves the booking contact snapshot and original form, and blocks competing invoices after an ambiguous submission.
    reason: Real FastAPI handlers, SQLAlchemy transactions and the changed service ran against synthetic dependency responses, including a paused preparation with a competing request and injected persistence failures.
    verification: Tests asserted final booking/waybill states, final cost 51.45 rather than difference -154.55, disabled automation behavior, original RPA enqueue without a token, failed-state retry, unknown-state exclusion across both invoice routes and cancel, and retention of the claim after local persistence failure. Related regression suite ran 87 tests with 84 passing and three unrelated simulation-dependent skips. MySQL locking was not exercised.
    source: tests/test_china_southern_air_direct_change.py; app/api/bookings.py
    updated_at: "2026-11-10"
  - id: live-csa-change-acceptance
    status: unknown
    claim: Real CSA accepts the complete change context built by this integration for all supported single-segment booking forms.
    reason: Final goods/check/create shapes and success semantics come from user-provided captures. Order identity and animal-query shapes also appear in the supplied HAR. The HAR did not include forward or change price/calculation traffic, so those requests were checked against public website JavaScript rather than a live transaction. No provider-owned Postman mock was discovered; local synthetic responses model the reviewed shapes, not airline acceptance.
    verification: Reviewed public app.3180677e.js and chunk-1934c426.3180677e.js; axios sends forward data as an ordinary JSON object. No authenticated airline endpoint or real change submission was called. Live acceptance, provider-side races and specialized shipment requirements still need authorized integration validation.
    source: API_DOCS.md; app/services/china_southern_air_direct_change.py; public CSA super-change JavaScript
    updated_at: "2026-11-10"
  - id: fee-recalculation-ignores-group-metadata
    status: supported
    claim: In the tested scenarios, omitted group newChecked or string versus numeric quantities do not cause repeated calculation when the flat fee inputs are already calculated; a genuinely unpriced mandatory single fee still blocks final submission.
    reason: The previous implementation reproduced the reported non-convergence error with a priced fee whose group marker was omitted. The public website helper treats that marker as display state. The corrected implementation compares actual flat fee inputs, synchronizes group display values and preserves optional fee quantities.
    verification: "On 2026-11-10, the regression suite ran 102 tests with 99 passing and three unrelated simulation-dependent skips. Seven local real-HTTP scenarios made 52 airline-shaped requests: the two new metadata/number-format scenarios each calculated once then submitted successfully, while the unpriced-fee scenario calculated three times and never called goods check/checkChange/createChange. Additional tests verified diagnostic 400 responses, invoice_status=2 and outcome_unknown=false, deleted-row handling, explicit selection changes, optional quantities and preservation of required-fee recalculation. The previously supplied final-change fee context was also normalized without requesting another calculation. The failing user's live calculateCharge response was not available, so this proves the reproduced defect and local fix, not the exact live response shape or live airline acceptance."
    source: tests/test_china_southern_air_direct_change.py; app/services/china_southern_air_direct_change.py; postman/mocks/csa-change/default.js; public CSA chunk-1934c426.3180677e.js module 9b68
    updated_at: "2026-11-10"
  - id: missing-contact-save-before-change
    status: supported
    claim: In local scenarios, incomplete live contacts are saved from the edited form before calculation; the client refreshes and validates the order context and uses the refreshed versions. Complete live contacts skip saving regardless of the booking snapshot.
    reason: The HTTP mock checks the contact mapping and preserved driver/notify/identity fields, advances the order and change versions after saving, and rejects calculations using old versions. State-machine tests additionally exercise the real FastAPI handler and SQLite persistence.
    verification: On 2026-11-13, eight related regression modules ran 95 tests with 93 passing and two unrelated simulation-dependent skips. Ten local HTTP scenarios made 67 airline-shaped requests. The three added scenarios covered a missing-contact successful invoice using versions 18/9, an explicit save rejection, and a reported successful save followed by incomplete contacts. The last two stopped before calculation and final submission. MockTransport/API tests also covered all eight missing fields, absent contacts, save timeout/500/non-JSON/unconfirmed success, refreshed identity mismatch, snapshot independence, unchanged booking snapshots, retry after an ambiguous contact save, and no fallback retry after a final business rejection.
    source: tests/test_china_southern_air_direct_change.py; postman/mocks/csa-change/default.js; app/services/china_southern_air_direct_change.py; API_DOCS.md
    updated_at: "2026-11-13"
  - id: live-missing-contact-save-contract
    status: unknown
    claim: Saving orderShipmentContact through saveContactAndLiveAnimals makes all real missing-contact orders eligible for the existing change flow and preserves omitted live-animal declarations.
    reason: The user supplied the contact-save request and a code 0000 result.MESSAGE success example, plus an observed change rejection on an order without contacts. This supports implementing a preflight contact save but does not establish every provider status transition or the semantics of omitted animal fields. Local mocks assume these semantics and cannot establish them for CSA. No provider-owned mock lookup was performed; the existing synthetic mock was extended from the supplied example.
    verification: Reviewed the supplied request/response and the existing forward/contact mappings. Ran the real client against a local synthetic HTTP service only. No captured credentials, real order IDs or live airline writes were used. Actual refreshed detail shapes, status eligibility and preservation of specialized declarations still require authorized integration validation; an ordinary status rejection never triggers an automatic final-submission retry.
    source: User-provided saveContactAndLiveAnimals request/response on 2026-11-13; app/services/china_southern_air_direct_change.py; postman/mocks/csa-change/default.js
    updated_at: "2026-11-13"
  - id: awaiting-approval-counts-as-invoice-success
    status: supported
    claim: In the tested modified-data direct invoice path, successful business responses with changeStatus S and no errorMsg are accepted alongside F; S remains visible as awaiting approval while local booking and waybill states are successful.
    reason: The user confirmed the real submitted order exists correctly on CSA and supplied changeStatus S with changeStatusName awaiting approval. The business requirement defines that accepted state as invoice success. The local implementation now recognizes the explicit status code without treating arbitrary pending states or display names as proof of success.
    verification: On 2026-11-13, eight related modules ran 97 tests with 95 passing and two unrelated simulation-dependent skips. Thirteen local HTTP scenarios made 93 airline-shaped calls, including existing-contact S success, missing-contact save and refreshed-context S success, and S with an errorMsg remaining unknown. API tests verified HTTP success, invoice_status=3, waybill airline_record_status=3, final settlement cost, automation invocation, preserved booking form/contact snapshot and rejection of duplicate invoices. Existing F, unknown P, timeout, rejection and RPA tests passed. No live airline requests or repairs to historical unknown records were performed.
    source: User-provided createChange result and website verification on 2026-11-13; tests/test_china_southern_air_direct_change.py; app/services/china_southern_air_direct_change.py; app/api/bookings.py; API_DOCS.md
    updated_at: "2026-11-13"
